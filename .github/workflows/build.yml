name: build

# Builds the desktop app for macOS and Windows. The native module (better-sqlite3) cannot be
# cross-compiled, so each OS is built on its own runner - Windows on windows-latest is what
# produces a working .exe (a Mac cannot).
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14      # arm64 -> .dmg
            build: pnpm --filter @csb/desktop dist
          - os: windows-latest # x64 -> nsis installer + portable .exe
            build: pnpm --filter @csb/desktop dist
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Approve native builds (pnpm)
        run: pnpm rebuild better-sqlite3

      - name: Build desktop
        run: ${{ matrix.build }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cryptoscanbot-${{ matrix.os }}
          path: |
            packages/desktop/release/*.dmg
            packages/desktop/release/*.exe
          if-no-files-found: ignore

  # On a v* tag, gather both runners' installers and publish them as a single GitHub Release with the
  # macOS .dmg and Windows .exe attached. Runs once (not per-OS) so there's one release, no race.
  release:
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
          fail_on_unmatched_files: false
          generate_release_notes: true
