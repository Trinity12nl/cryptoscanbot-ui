appId: com.cryptoscanbot.ui
productName: CryptoScanBot-ui
directories:
  output: release
  buildResources: build

# The bundled main process + our own package files. better-sqlite3 (native) is included as a real
# node_module and rebuilt for Electron's ABI.
files:
  - dist/**
  - package.json

# The built web UI, copied into the app so the in-process bridge can serve it (same-origin).
extraResources:
  - from: ../web/dist
    to: web

# We rebuild better-sqlite3 for Electron's ABI ourselves, BEFORE electron-builder runs, via the
# `rebuild:native` script (electron-rebuild downloads the electron-v130 prebuilt - no compiler). So
# electron-builder must NOT rebuild again: under pnpm's symlinked tree its own rebuild is unreliable
# and could revert the ABI. It just packages the correct-ABI binary we already placed.
npmRebuild: false

mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.finance
  icon: build/icon.icns
  # Unsigned for now: users right-click > Open once to get past Gatekeeper. Notarization later.
  identity: null

dmg:
  title: CryptoScanBot-ui

# Windows: an NSIS installer + a portable (no-install) .exe. MUST be built ON Windows - the native
# better-sqlite3 cannot be cross-compiled from macOS (node-gyp can't target win32 from darwin).
# Use the GitHub Actions workflow (.github/workflows/build.yml, windows-latest) or run
# `pnpm --filter @csb/desktop dist` on a Windows machine. On Windows, better-sqlite3 resolves a
# prebuilt binary for Electron's ABI, so no compiler is needed. icon.png is auto-converted to .ico.
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.png

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: CryptoScanBot-ui
